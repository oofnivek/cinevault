<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineVault</title>
<script>
  if (localStorage.getItem('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');
</script>
<style>
  :root {
    --color-bg: #0b0d12;
    --color-surface: #141926;
    --color-surface-hover: #1b2233;
    --color-text: #e6e8ee;
    --color-text-dim: #9aa1b1;
    --color-border: #232a3b;
    --color-accent: #34d3ac;
    --radius-lg: 16px;
    --shadow-lg: 0 20px 40px rgba(0,0,0,.5);
    --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px;
  }
  :root[data-theme="light"] {
    --color-bg: #f7f8fa;
    --color-surface: #ffffff;
    --color-surface-hover: #eef1f5;
    --color-text: #171a21;
    --color-text-dim: #5c6470;
    --color-border: #dde1e7;
    --color-accent: #0e9f7d;
    --shadow-lg: 0 20px 40px rgba(15,23,42,.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-6);
    background: var(--color-bg);
    color: var(--color-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 26px; color: var(--color-accent); }

  .theme-toggle-btn {
    position: fixed; top: var(--space-4); right: var(--space-4);
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; padding: 0;
    border: 1px solid var(--color-border); border-radius: 999px;
    background: transparent; color: var(--color-text-dim); cursor: pointer;
  }
  .theme-toggle-btn:hover { background: var(--color-surface-hover); color: var(--color-text); }
  .theme-toggle-btn svg { display: block; }
  .theme-icon-moon { display: none; }
  :root[data-theme="light"] .theme-icon-sun { display: none; }
  :root[data-theme="light"] .theme-icon-moon { display: block; }

  .choices { display: flex; gap: var(--space-4); flex-wrap: wrap; justify-content: center; padding: 0 var(--space-4); }
  .choice {
    display: flex; flex-direction: column; align-items: center; gap: var(--space-2);
    width: 220px; padding: var(--space-6) var(--space-4);
    background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
    text-decoration: none; color: inherit; box-shadow: var(--shadow-lg);
    transition: transform .12s ease, background .12s ease;
  }
  .choice:hover { background: var(--color-surface-hover); transform: translateY(-2px); }
  .choice:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .choice svg { color: var(--color-accent); }
  .choice-title { font-size: 18px; font-weight: 600; }
  .choice-subtitle { font-size: 13px; color: var(--color-text-dim); }
</style>
</head>
<body>

<button type="button" class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle day/night theme" title="Toggle day/night theme">
  <svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line></svg>
  <svg class="theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
</button>

<div class="brand">
  <svg width="28" height="28" viewBox="0 0 256 256" fill="currentColor"><path opacity="0.25" d="M224,80l-96,56L32,80l96-56Z"/><path d="M230.91,172A8,8,0,0,1,228,182.91l-96,56a8,8,0,0,1-8.06,0l-96-56A8,8,0,0,1,36,169.09l92,53.65,92-53.65A8,8,0,0,1,230.91,172ZM220,121.09l-92,53.65L36,121.09A8,8,0,0,0,28,134.91l96,56a8,8,0,0,0,8.06,0l96-56A8,8,0,1,0,220,121.09ZM24,80a8,8,0,0,1,4-6.91l96-56a8,8,0,0,1,8.06,0l96,56a8,8,0,0,1,0,13.82l-96,56a8,8,0,0,1-8.06,0l-96-56A8,8,0,0,1,24,80Zm23.88,0L128,126.74,208.12,80,128,33.26Z"/></svg>
  CineVault
</div>

<div class="choices">
  <a href="/movies" class="choice">
    <svg width="40" height="40" viewBox="0 0 256 256" fill="currentColor"><path d="M232,64H208V56a16,16,0,0,0-16-16H64A16,16,0,0,0,48,56v8H24A16,16,0,0,0,8,80V184a16,16,0,0,0,16,16H48v8a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16v-8h24a16,16,0,0,0,16-16V80A16,16,0,0,0,232,64ZM24,80H48v72H24ZM192,208H64V56H192V208Zm40-24H208V112h24Z"/></svg>
    <div class="choice-title">Movies</div>
    <div class="choice-subtitle">{{.MovieCount}} in your library</div>
  </a>

  <a href="/series" class="choice">
    <svg width="40" height="40" viewBox="0 0 256 256" fill="currentColor"><path d="M216,40H40A16,16,0,0,0,24,56V176a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40ZM40,176V56H216V176ZM160,216a8,8,0,0,1-8,8H104a8,8,0,0,1,0-16h48A8,8,0,0,1,160,216Z"/></svg>
    <div class="choice-title">Series</div>
    <div class="choice-subtitle">{{.SeriesCount}} in your library</div>
  </a>
</div>

<script>
document.getElementById('theme-toggle').addEventListener('click', () => {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if (isLight) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('theme', 'dark');
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    localStorage.setItem('theme', 'light');
  }
});
</script>
</body>
</html>
