<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Series — CineVault</title>
<script>
  if (localStorage.getItem('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');
</script>
<style>
  :root {
    --color-bg: #0b0d12;
    --color-surface: #141926;
    --color-surface-hover: #1b2233;
    --color-text: #e6e8ee;
    --color-text-dim: #9aa1b1;
    --color-border: #232a3b;
    --color-accent: #34d3ac;
    --radius: 10px;
    --radius-lg: 16px;
    --shadow-lg: 0 20px 40px rgba(0,0,0,.5);
    --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px;
  }
  :root[data-theme="light"] {
    --color-bg: #f7f8fa;
    --color-surface: #ffffff;
    --color-surface-hover: #eef1f5;
    --color-text: #171a21;
    --color-text-dim: #5c6470;
    --color-border: #dde1e7;
    --color-accent: #0e9f7d;
    --shadow-lg: 0 20px 40px rgba(15,23,42,.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  a { color: var(--color-accent); }

  .nav {
    display: flex; align-items: center; gap: 8px;
    padding: var(--space-4) var(--space-6);
    border-bottom: 1px solid var(--color-border);
    position: sticky; top: 0; background: var(--color-bg); z-index: 10;
  }
  .nav-brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 18px; color: var(--color-accent); text-decoration: none; }
  .nav-brand:hover { opacity: 0.8; }
  .theme-toggle-btn {
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; padding: 0; margin-left: auto;
    border: 1px solid var(--color-border); border-radius: 999px;
    background: transparent; color: var(--color-text-dim); cursor: pointer;
  }
  .theme-toggle-btn:hover { background: var(--color-surface-hover); color: var(--color-text); }
  .theme-toggle-btn svg { display: block; }
  .theme-icon-moon { display: none; }
  :root[data-theme="light"] .theme-icon-sun { display: none; }
  :root[data-theme="light"] .theme-icon-moon { display: block; }

  .breadcrumb { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: var(--space-3) var(--space-6) 0; font-size: 13px; max-width: 1400px; margin: 0 auto; }
  .breadcrumb a { color: var(--color-text-dim); text-decoration: none; }
  .breadcrumb a:hover { color: var(--color-accent); }
  .breadcrumb .crumb-sep { color: var(--color-text-dim); opacity: 0.5; }
  .breadcrumb .crumb-current { color: var(--color-text); }

  main { padding: var(--space-6); max-width: 1400px; margin: 0 auto; }
  .title-row { display: flex; align-items: baseline; gap: var(--space-2); margin-bottom: var(--space-4); }
  h1.title { font-size: 32px; margin: 0; }
  .subtitle { margin: 0; color: var(--color-text-dim); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: var(--space-3); }
  .card {
    display: block; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
    padding: 0; text-decoration: none; color: inherit; overflow: hidden;
    transition: transform .12s ease, background .12s ease;
  }
  .card:hover { background: var(--color-surface-hover); transform: translateY(-2px); }
  .card:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .poster { aspect-ratio: 2/3; overflow: hidden; background: linear-gradient(160deg, #22283a, #141926); display: flex; align-items: center; justify-content: center; }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-fallback { font-size: 42px; font-weight: 700; color: var(--color-text-dim); }
  .card-body { padding: var(--space-2) var(--space-3) var(--space-3); }
  .card-title { font-size: 15px; line-height: 1.3; }
  .card-meta { font-size: 13px; color: var(--color-text-dim); margin-top: 2px; }

  .empty { max-width: 420px; padding: var(--space-6) 0; color: var(--color-text-dim); }

  .bottom-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; margin-top: var(--space-6); }
  .per-page { display: flex; align-items: center; gap: var(--space-2); font-size: 13px; color: var(--color-text-dim); }
  .input {
    background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-text);
    border-radius: var(--radius); padding: 10px 12px; font-size: 14px;
  }
  .input:focus { outline: 2px solid var(--color-accent); outline-offset: -1px; }
  .pagination { display: flex; align-items: center; gap: var(--space-2); }
  .btn { background: transparent; border: 1px solid var(--color-border); color: var(--color-text); border-radius: var(--radius); padding: 8px; cursor: pointer; display: flex; align-items: center; }
  .btn:hover:not(:disabled) { background: var(--color-surface-hover); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .page-jump { font-size: 13px; color: var(--color-text-dim); display: flex; align-items: center; gap: 6px; }
  .page-jump input { width: 48px; text-align: center; padding: 4px 6px; }

  [hidden] { display: none !important; }

  @media (max-width: 600px) {
    .nav { padding: 10px var(--space-4); }
    main { padding: var(--space-4); }
    .title-row { margin-bottom: var(--space-2); }
    .title { font-size: 20px; }
    .subtitle { font-size: 12px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: var(--space-2); }

    .bottom-bar { margin-top: var(--space-4); gap: var(--space-2); }
    .per-page { font-size: 12px; gap: 4px; }
    .per-page .input { width: 44px !important; padding: 4px !important; font-size: 12px; }
    .pagination { gap: 4px; }
    .btn { padding: 6px; }
    .page-jump { gap: 3px; font-size: 12px; }
    .page-jump-label { display: none; }
    .page-jump input { width: 28px; padding: 2px 4px; }
  }
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-brand" title="Back to CineVault">
    <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path opacity="0.25" d="M224,80l-96,56L32,80l96-56Z"/><path d="M230.91,172A8,8,0,0,1,228,182.91l-96,56a8,8,0,0,1-8.06,0l-96-56A8,8,0,0,1,36,169.09l92,53.65,92-53.65A8,8,0,0,1,230.91,172ZM220,121.09l-92,53.65L36,121.09A8,8,0,0,0,28,134.91l96,56a8,8,0,0,0,8.06,0l96-56A8,8,0,1,0,220,121.09ZM24,80a8,8,0,0,1,4-6.91l96-56a8,8,0,0,1,8.06,0l96,56a8,8,0,0,1,0,13.82l-96,56a8,8,0,0,1-8.06,0l-96-56A8,8,0,0,1,24,80Zm23.88,0L128,126.74,208.12,80,128,33.26Z"/></svg>
    CineVault
  </a>

  <button type="button" class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle day/night theme" title="Toggle day/night theme">
    <svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line></svg>
    <svg class="theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>
</nav>

{{if .Breadcrumbs}}
<div class="breadcrumb">
  {{range $i, $c := .Breadcrumbs}}{{if $i}}<span class="crumb-sep">/</span>{{end}}{{if $c.URL}}<a href="{{$c.URL}}">{{$c.Label}}</a>{{else}}<span class="crumb-current">{{$c.Label}}</span>{{end}}{{end}}
</div>
{{end}}

<main>
  <div class="title-row">
    <h1 class="title">Series</h1>
    <p class="subtitle" id="result-count"></p>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <div class="card-title">No series found</div>
    <p>Add folders under your series directory, one per show.</p>
  </div>

  <div class="bottom-bar">
    <label class="per-page">
      Per page
      <input class="input" type="number" id="page-size" min="1" style="width: 72px; padding-block: 6px;" />
    </label>

    <div class="pagination" id="pagination" hidden>
      <button type="button" class="btn" id="prev-page" aria-label="Previous page">
        <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor"><path opacity="0.25" d="M176,48V208L80,128Z"/><path d="M181.66,133.66l-96,96a8,8,0,0,1-11.32-11.32L164.69,128,74.34,37.66a8,8,0,0,1,11.32-11.32l96,96A8,8,0,0,1,181.66,133.66Z" transform="scale(-1,1) translate(-256,0)"/></svg>
      </button>
      <span class="page-jump">
        <span class="page-jump-label">Page</span>
        <input type="number" class="input" min="1" id="page-input" />
        of <span id="total-pages"></span>
      </span>
      <button type="button" class="btn" id="next-page" aria-label="Next page">
        <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor"><path opacity="0.25" d="M176,48V208L80,128Z" transform="scale(-1,1) translate(-256,0)"/><path d="M181.66,133.66l-96,96a8,8,0,0,1-11.32-11.32L164.69,128,74.34,37.66a8,8,0,0,1,11.32-11.32l96,96A8,8,0,0,1,181.66,133.66Z"/></svg>
      </button>
    </div>
  </div>
</main>

<script>
const SERIES = {{.SeriesJSON}};

function getCookie(name) {
  const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return match ? decodeURIComponent(match[1]) : null;
}

function setCookie(name, value) {
  document.cookie = name + '=' + encodeURIComponent(value) + '; max-age=' + (400 * 24 * 60 * 60) + '; path=/';
}

const DEFAULT_PAGE_SIZE = window.matchMedia('(max-width: 600px)').matches ? 10 : 21;

let pageSize = Number(getCookie('seriesPageSize')) || DEFAULT_PAGE_SIZE;
let page = Number(getCookie('seriesPage')) || 1;

const gridEl = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const resultCountEl = document.getElementById('result-count');
const paginationEl = document.getElementById('pagination');
const totalPagesEl = document.getElementById('total-pages');
const pageInputEl = document.getElementById('page-input');
const pageSizeEl = document.getElementById('page-size');
pageSizeEl.value = pageSize;

function renderGrid() {
  const totalPages = Math.max(1, Math.ceil(SERIES.length / pageSize));
  page = Math.min(Math.max(1, page), totalPages);
  setCookie('seriesPage', page);
  const pageItems = SERIES.slice((page - 1) * pageSize, page * pageSize);

  resultCountEl.textContent = SERIES.length === 0
    ? 'No series found'
    : SERIES.length + ' series';

  gridEl.innerHTML = '';
  emptyEl.hidden = SERIES.length > 0;

  for (const s of pageItems) {
    const card = document.createElement('a');
    card.href = s.detailUrl;
    card.className = 'card';

    const poster = document.createElement('div');
    poster.className = 'poster';
    if (s.poster) {
      const img = document.createElement('img');
      img.src = s.poster;
      img.alt = s.name;
      img.loading = 'lazy';
      poster.appendChild(img);
    } else {
      const fallback = document.createElement('span');
      fallback.className = 'card-fallback';
      fallback.textContent = (s.name[0] || '?').toUpperCase();
      poster.appendChild(fallback);
    }

    const body = document.createElement('div');
    body.className = 'card-body';
    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = s.name;
    const meta = document.createElement('div');
    meta.className = 'card-meta';
    meta.textContent = s.seasonCount + ' season' + (s.seasonCount === 1 ? '' : 's') +
      ' · ' + s.episodeCount + ' episode' + (s.episodeCount === 1 ? '' : 's');
    body.append(title, meta);

    card.append(poster, body);
    gridEl.appendChild(card);
  }

  paginationEl.hidden = totalPages <= 1;
  totalPagesEl.textContent = totalPages;
  pageInputEl.max = totalPages;
  pageInputEl.value = page;
  document.getElementById('prev-page').disabled = page === 1;
  document.getElementById('next-page').disabled = page === totalPages;
}

pageSizeEl.addEventListener('change', (e) => {
  pageSize = Math.max(1, Number(e.target.value) || DEFAULT_PAGE_SIZE);
  pageSizeEl.value = pageSize;
  setCookie('seriesPageSize', pageSize);
  page = 1;
  renderGrid();
});

document.getElementById('prev-page').addEventListener('click', () => { page -= 1; renderGrid(); });
document.getElementById('next-page').addEventListener('click', () => { page += 1; renderGrid(); });
pageInputEl.addEventListener('change', (e) => {
  page = Number(e.target.value) || 1;
  renderGrid();
});

// Left/right arrow keys page through the grid, unless the user is typing
// into a text field (page-size, page-jump) where arrows should move the
// text cursor instead.
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft' && page > 1) {
    page -= 1;
    renderGrid();
  } else if (e.key === 'ArrowRight' && page < Number(totalPagesEl.textContent)) {
    page += 1;
    renderGrid();
  }
});

renderGrid();

document.getElementById('theme-toggle').addEventListener('click', () => {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if (isLight) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('theme', 'dark');
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    localStorage.setItem('theme', 'light');
  }
});
</script>
</body>
</html>
