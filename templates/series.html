<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Series — CineVault</title>
<style>
  :root {
    --color-bg: #0b0d12;
    --color-surface: #141926;
    --color-surface-hover: #1b2233;
    --color-text: #e6e8ee;
    --color-text-dim: #9aa1b1;
    --color-border: #232a3b;
    --color-accent: #34d3ac;
    --radius: 10px;
    --radius-lg: 16px;
    --shadow-lg: 0 20px 40px rgba(0,0,0,.5);
    --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  a { color: var(--color-accent); }

  .nav {
    display: flex; align-items: center; gap: 8px;
    padding: var(--space-4) var(--space-6);
    border-bottom: 1px solid var(--color-border);
    position: sticky; top: 0; background: var(--color-bg); z-index: 10;
  }
  .nav-brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 18px; color: var(--color-accent); text-decoration: none; }
  .nav-brand:hover { opacity: 0.8; }

  main { padding: var(--space-6); max-width: 1400px; margin: 0 auto; }
  h1.title { font-size: 32px; margin: 0 0 var(--space-4); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: var(--space-3); }
  .card {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-2);
    background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
    padding: var(--space-6) var(--space-3); text-decoration: none; color: inherit; text-align: center;
    transition: transform .12s ease, background .12s ease;
  }
  .card:hover { background: var(--color-surface-hover); transform: translateY(-2px); }
  .card:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .card-fallback { font-size: 32px; font-weight: 700; color: var(--color-text-dim); }
  .card-title { font-size: 15px; line-height: 1.3; }
  .card-meta { font-size: 13px; color: var(--color-text-dim); }

  .empty { max-width: 420px; padding: var(--space-6) 0; color: var(--color-text-dim); }

  @media (max-width: 600px) {
    .nav { padding: 10px var(--space-4); }
    main { padding: var(--space-4); }
    .title { font-size: 20px; margin-bottom: var(--space-2); }
    .grid { grid-template-columns: repeat(2, 1fr); gap: var(--space-2); }
  }
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-brand" title="Back to CineVault">
    <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path opacity="0.25" d="M224,80l-96,56L32,80l96-56Z"/><path d="M230.91,172A8,8,0,0,1,228,182.91l-96,56a8,8,0,0,1-8.06,0l-96-56A8,8,0,0,1,36,169.09l92,53.65,92-53.65A8,8,0,0,1,230.91,172ZM220,121.09l-92,53.65L36,121.09A8,8,0,0,0,28,134.91l96,56a8,8,0,0,0,8.06,0l96-56A8,8,0,1,0,220,121.09ZM24,80a8,8,0,0,1,4-6.91l96-56a8,8,0,0,1,8.06,0l96,56a8,8,0,0,1,0,13.82l-96,56a8,8,0,0,1-8.06,0l-96-56A8,8,0,0,1,24,80Zm23.88,0L128,126.74,208.12,80,128,33.26Z"/></svg>
    CineVault
  </a>
</nav>

<main>
  <h1 class="title">Series</h1>

  {{if .Series}}
  <div class="grid">
    {{range .Series}}
    <a href="{{.DetailURL}}" class="card">
      <span class="card-fallback">{{slice .Name 0 1}}</span>
      <div class="card-title">{{.Name}}</div>
      <div class="card-meta">{{.SeasonCount}} season{{if ne .SeasonCount 1}}s{{end}} · {{.EpisodeCount}} episode{{if ne .EpisodeCount 1}}s{{end}}</div>
    </a>
    {{end}}
  </div>
  {{else}}
  <div class="empty">
    <p>No series found. Add folders under your series directory, one per show.</p>
  </div>
  {{end}}
</main>
</body>
</html>
