<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineVault</title>
<script>
  if (localStorage.getItem('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');
</script>
<style>
  :root {
    --color-bg: #0b0d12;
    --color-surface: #141926;
    --color-surface-hover: #1b2233;
    --color-text: #e6e8ee;
    --color-text-dim: #9aa1b1;
    --color-border: #232a3b;
    --color-accent: #34d3ac;
    --color-accent-strong: #22b795;
    --radius: 10px;
    --radius-lg: 16px;
    --shadow-lg: 0 20px 40px rgba(0,0,0,.5);
    --space-1: 4px; --space-2: 8px; --space-3: 12px;
    --space-4: 16px; --space-6: 24px; --space-8: 32px;
  }
  :root[data-theme="light"] {
    --color-bg: #f7f8fa;
    --color-surface: #ffffff;
    --color-surface-hover: #eef1f5;
    --color-text: #171a21;
    --color-text-dim: #5c6470;
    --color-border: #dde1e7;
    --color-accent: #0e9f7d;
    --color-accent-strong: #0b8267;
    --shadow-lg: 0 20px 40px rgba(15,23,42,.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  a { color: var(--color-accent); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #2a3245; border-radius: 999px; }

  .nav {
    display: flex; align-items: center; gap: 8px;
    padding: var(--space-4) var(--space-6);
    border-bottom: 1px solid var(--color-border);
    position: sticky; top: 0; background: var(--color-bg); z-index: 10;
  }
  .nav-brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 18px; color: var(--color-accent); text-decoration: none; }
  .nav-brand:hover { opacity: 0.8; }
  .theme-toggle-btn {
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; padding: 0; margin-left: auto;
    border: 1px solid var(--color-border); border-radius: 999px;
    background: transparent; color: var(--color-text-dim); cursor: pointer;
  }
  .theme-toggle-btn:hover { background: var(--color-surface-hover); color: var(--color-text); }
  .theme-icon-sun { display: block; }
  .theme-icon-moon { display: none; }
  :root[data-theme="light"] .theme-icon-sun { display: none; }
  :root[data-theme="light"] .theme-icon-moon { display: block; }

  .breadcrumb { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: var(--space-3) var(--space-6) 0; font-size: 13px; max-width: 1400px; margin: 0 auto; }
  .breadcrumb a { color: var(--color-text-dim); text-decoration: none; }
  .breadcrumb a:hover { color: var(--color-accent); }
  .breadcrumb .crumb-sep { color: var(--color-text-dim); opacity: 0.5; }
  .breadcrumb .crumb-current { color: var(--color-text); }

  main { padding: var(--space-6); max-width: 1400px; margin: 0 auto; }
  .title-row { display: flex; align-items: baseline; gap: var(--space-2); margin-bottom: var(--space-4); }
  h1.title { font-size: 32px; margin: 0; }
  .subtitle { margin: 0; color: var(--color-text-dim); }

  .toolbar { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; margin-bottom: var(--space-4); }
  .field { position: relative; min-width: 240px; }
  .field > svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity: 0.6; pointer-events: none; }
  .input {
    background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-text);
    border-radius: var(--radius); padding: 10px 12px; font-size: 14px; width: 100%;
  }
  .input:focus { outline: 2px solid var(--color-accent); outline-offset: -1px; }
  .field .input { padding-left: 38px; padding-right: 34px; }
  .clear-search-btn {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    display: flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; padding: 0; border: none; border-radius: 999px;
    background: transparent; color: var(--color-text-dim); cursor: pointer;
  }
  .clear-search-btn:hover { background: var(--color-surface-hover); color: var(--color-text); }

  .seg { display: flex; border: 1px solid var(--color-border); border-radius: var(--radius); overflow: hidden; margin-left: auto; }
  .seg label { padding: 8px 14px; font-size: 13px; cursor: pointer; color: var(--color-text-dim); display: flex; align-items: center; gap: 6px; }
  .seg input { accent-color: var(--color-accent); }
  .seg label:not(:last-child) { border-right: 1px solid var(--color-border); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: var(--space-3); }
  .card {
    display: block; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
    padding: 0; cursor: pointer; text-align: left; text-decoration: none; color: inherit; font: inherit; overflow: hidden;
    transition: transform .12s ease, background .12s ease;
  }
  .card:hover { background: var(--color-surface-hover); transform: translateY(-2px); }
  .card:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .poster { position: relative; aspect-ratio: 2/3; overflow: hidden; background: linear-gradient(160deg, #22283a, #141926); display: flex; align-items: center; justify-content: center; }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .poster .fallback { font-size: 42px; font-weight: 700; color: var(--color-text-dim); }
  .fetch-poster-btn {
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; padding: 0; border-radius: 999px; flex-shrink: 0;
    background: transparent; border: 1px solid var(--color-border); color: var(--color-text-dim);
    cursor: pointer;
  }
  .fetch-poster-btn:hover:not(:disabled) { background: var(--color-surface-hover); color: var(--color-accent); }
  .fetch-poster-btn:disabled { opacity: 0.5; cursor: default; }
  .fetch-poster-btn svg { animation: none; }
  .fetch-poster-btn.loading svg { animation: fetch-poster-spin 0.9s linear infinite; }
  @keyframes fetch-poster-spin { to { transform: rotate(360deg); } }
  .card-body { padding: var(--space-2) var(--space-3) var(--space-3); }
  .card-title { font-size: 15px; line-height: 1.3; min-height: calc(1.3em * 2); display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
  .card-year { font-size: 13px; color: var(--color-text-dim); }

  .empty { max-width: 420px; padding: var(--space-6) 0; color: var(--color-text-dim); }

  .bottom-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; margin-top: var(--space-6); }
  .per-page { display: flex; align-items: center; gap: var(--space-2); font-size: 13px; color: var(--color-text-dim); }
  .pagination { display: flex; align-items: center; gap: var(--space-2); }
  .btn { background: transparent; border: 1px solid var(--color-border); color: var(--color-text); border-radius: var(--radius); padding: 8px; cursor: pointer; display: flex; align-items: center; }
  .btn:hover:not(:disabled) { background: var(--color-surface-hover); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .page-jump { font-size: 13px; color: var(--color-text-dim); display: flex; align-items: center; gap: 6px; }
  .page-jump input { width: 48px; text-align: center; padding: 4px 6px; }

  [hidden] { display: none !important; }

  @media (max-width: 600px) {
    .nav { padding: 10px var(--space-4); }
    main { padding: var(--space-4); }
    .title-row { margin-bottom: var(--space-2); }
    .title { font-size: 20px; }
    .subtitle { font-size: 12px; }
    .toolbar { gap: var(--space-2); margin-bottom: var(--space-2); }
    .grid { grid-template-columns: repeat(2, 1fr); gap: var(--space-2); }
    .field { min-width: 0; flex: 1 1 100%; }
    .field .input { padding: 8px 32px 8px 36px; font-size: 13px; }
    .seg { margin-left: 0; flex: 1 1 calc(50% - 4px); min-width: 0; width: auto; }
    .seg label { flex: 1; justify-content: center; padding: 8px 4px; font-size: 12px; }
    #genre-filter { flex: 1 1 calc(50% - 4px); min-width: 0; width: auto; padding: 8px; font-size: 13px; }

    .bottom-bar { margin-top: var(--space-4); gap: var(--space-2); }
    .per-page { font-size: 12px; gap: 4px; }
    .per-page .input { width: 44px !important; padding: 4px !important; font-size: 12px; }
    .pagination { gap: 4px; }
    .btn { padding: 6px; }
    .page-jump { gap: 3px; font-size: 12px; }
    .page-jump-label { display: none; }
    .page-jump input { width: 28px; padding: 2px 4px; }
  }
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-brand" title="Back to CineVault">
    <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path opacity="0.25" d="M224,80l-96,56L32,80l96-56Z"/><path d="M230.91,172A8,8,0,0,1,228,182.91l-96,56a8,8,0,0,1-8.06,0l-96-56A8,8,0,0,1,36,169.09l92,53.65,92-53.65A8,8,0,0,1,230.91,172ZM220,121.09l-92,53.65L36,121.09A8,8,0,0,0,28,134.91l96,56a8,8,0,0,0,8.06,0l96-56A8,8,0,1,0,220,121.09ZM24,80a8,8,0,0,1,4-6.91l96-56a8,8,0,0,1,8.06,0l96,56a8,8,0,0,1,0,13.82l-96,56a8,8,0,0,1-8.06,0l-96-56A8,8,0,0,1,24,80Zm23.88,0L128,126.74,208.12,80,128,33.26Z"/></svg>
    CineVault
  </a>

  <button type="button" class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle day/night theme" title="Toggle day/night theme">
    <svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line></svg>
    <svg class="theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>
</nav>

{{if .Breadcrumbs}}
<div class="breadcrumb">
  {{range $i, $c := .Breadcrumbs}}{{if $i}}<span class="crumb-sep">/</span>{{end}}{{if $c.URL}}<a href="{{$c.URL}}">{{$c.Label}}</a>{{else}}<span class="crumb-current">{{$c.Label}}</span>{{end}}{{end}}
</div>
{{end}}

<main>
  <div id="grid-view">
    <div class="title-row">
      <h1 class="title">Movies</h1>
      <p class="subtitle" id="result-count"></p>
    </div>

    <div class="toolbar">
      <div class="field">
        <svg width="15" height="15" viewBox="0 0 256 256" fill="currentColor"><path opacity="0.25" d="M168,112a56,56,0,1,1-56-56A56,56,0,0,1,168,112Z"/><path d="M229.66,218.34,175.4,164.08a92.31,92.31,0,1,0-11.32,11.32l54.26,54.26a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"/></svg>
        <input class="input" type="text" id="search" placeholder="Search by title or actor…" />
        <button type="button" class="clear-search-btn" id="clear-search" aria-label="Clear search" hidden>
          <svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"></path></svg>
        </button>
      </div>

      <select class="input" id="genre-filter" style="width: auto;" aria-label="Filter by genre">
        <option value="">All genres</option>
      </select>

      <div class="seg" role="radiogroup" aria-label="Sort by">
        <label><input type="radio" name="sort" value="year" checked />Year</label>
        <label><input type="radio" name="sort" value="name" />Name</label>
      </div>
    </div>

    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <div class="card-title">No movies match</div>
      <p>Try a different title.</p>
    </div>

    <div class="bottom-bar">
      <label class="per-page">
        Per page
        <input class="input" type="number" id="page-size" min="1" style="width: 72px; padding-block: 6px;" />
      </label>

      <div class="pagination" id="pagination" hidden>
        <button type="button" class="btn" id="prev-page" aria-label="Previous page">
          <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor"><path opacity="0.25" d="M176,48V208L80,128Z"/><path d="M181.66,133.66l-96,96a8,8,0,0,1-11.32-11.32L164.69,128,74.34,37.66a8,8,0,0,1,11.32-11.32l96,96A8,8,0,0,1,181.66,133.66Z" transform="scale(-1,1) translate(-256,0)"/></svg>
        </button>
        <span class="page-jump">
          <span class="page-jump-label">Page</span>
          <input type="number" class="input" min="1" id="page-input" />
          of <span id="total-pages"></span>
        </span>
        <button type="button" class="btn" id="next-page" aria-label="Next page">
          <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor"><path opacity="0.25" d="M176,48V208L80,128Z" transform="scale(-1,1) translate(-256,0)"/><path d="M181.66,133.66l-96,96a8,8,0,0,1-11.32-11.32L164.69,128,74.34,37.66a8,8,0,0,1,11.32-11.32l96,96A8,8,0,0,1,181.66,133.66Z"/></svg>
        </button>
      </div>
    </div>
  </div>


</main>

<script>
const MOVIES = {{.MoviesJSON}};
const TMDB_ENABLED = {{.TMDbEnabled}};

function getCookie(name) {
  const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return match ? decodeURIComponent(match[1]) : null;
}

function setCookie(name, value) {
  document.cookie = name + '=' + encodeURIComponent(value) + '; max-age=' + (400 * 24 * 60 * 60) + '; path=/';
}

const DEFAULT_PAGE_SIZE = window.matchMedia('(max-width: 600px)').matches ? 10 : 21;

let query = '';
let genreFilter = '';
let sortBy = 'year';
let pageSize = Number(getCookie('pageSize')) || DEFAULT_PAGE_SIZE;
let page = Number(getCookie('page')) || 1;

const gridEl = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const resultCountEl = document.getElementById('result-count');
const paginationEl = document.getElementById('pagination');
const totalPagesEl = document.getElementById('total-pages');
const pageInputEl = document.getElementById('page-input');
const pageSizeEl = document.getElementById('page-size');
const genreFilterEl = document.getElementById('genre-filter');
const searchEl = document.getElementById('search');
const clearSearchEl = document.getElementById('clear-search');
pageSizeEl.value = pageSize;

// Only offer genres that actually appear in this library, so picking one
// never leads to a guaranteed-empty result.
for (const genre of [...new Set(MOVIES.flatMap((m) => m.genres || []))].sort()) {
  const option = document.createElement('option');
  option.value = genre;
  option.textContent = genre;
  genreFilterEl.appendChild(option);
}

// Strips accents/diacritics (e.g. "é" -> "e") so searching "pokemon" finds
// "Pokémon". NFD splits accented characters into base letter + combining
// mark, then the combining marks (U+0300-U+036f) are dropped.
function foldAccents(str) {
  return str.normalize('NFD').replace(/[̀-ͯ]/g, '');
}

// Phrase search across title + cast; the genre dropdown handles genre
// filtering with an exact match, since a fixed list beats free-text
// guessing at exact genre names. The whole query must appear, in order, in
// the title or in one cast member's full name — so "keanu reeves" matches
// via that single cast entry, but splitting words across two unrelated
// people (e.g. "wick" hitting mid-word inside "Chadwick" while "john"
// separately hits some other actor) can't produce a false match.
function filtered() {
  const q = foldAccents(query.trim().toLowerCase()).replace(/\s+/g, ' ');
  let list = MOVIES.filter((m) => {
    const title = foldAccents(m.title.toLowerCase());
    const cast = (m.cast || []).map((name) => foldAccents(name.toLowerCase()));
    if (q && !title.includes(q) && !cast.some((name) => name.includes(q))) return false;
    if (genreFilter && !(m.genres || []).includes(genreFilter)) return false;
    return true;
  });
  list = list.slice().sort((a, b) => sortBy === 'name' ? a.title.localeCompare(b.title) : b.year - a.year);
  return list;
}

const DOWNLOAD_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>';
const SPINNER_ICON = '<svg width="16" height="16" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-dasharray="90 150"/></svg>';

// Fetches tmdb.json + poster for one movie that doesn't have a poster yet
// (see the fetch-poster-btn only ever being rendered in that case below).
// The card is an <a>, so clicks here must stop it from navigating.
function fetchPoster(e, movie, btn) {
  e.preventDefault();
  e.stopPropagation();
  btn.disabled = true;
  btn.classList.add('loading');
  btn.innerHTML = SPINNER_ICON;
  btn.title = 'Fetching…';

  fetch(movie.fetchPosterUrl, { method: 'POST' })
    .then(async (res) => {
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ('request failed (' + res.status + ')'));
      Object.assign(movie, data);
      renderGrid();
    })
    .catch((err) => {
      btn.disabled = false;
      btn.classList.remove('loading');
      btn.innerHTML = DOWNLOAD_ICON;
      btn.title = err.message;
    });
}

function renderGrid() {
  const list = filtered();
  const totalPages = Math.max(1, Math.ceil(list.length / pageSize));
  page = Math.min(Math.max(1, page), totalPages);
  setCookie('page', page);
  const pageItems = list.slice((page - 1) * pageSize, page * pageSize);

  resultCountEl.textContent = MOVIES.length === 0
    ? 'No movies found'
    : list.length + ' movie' + (list.length === 1 ? '' : 's');

  gridEl.innerHTML = '';
  emptyEl.hidden = !(MOVIES.length > 0 && pageItems.length === 0);

  for (const movie of pageItems) {
    const card = document.createElement('a');
    card.href = movie.watchUrl;
    card.className = 'card';

    const poster = document.createElement('div');
    poster.className = 'poster';
    let fetchBtn = null;
    if (movie.poster) {
      const img = document.createElement('img');
      img.src = movie.poster;
      img.alt = movie.title;
      img.loading = 'lazy';
      poster.appendChild(img);
    } else {
      const fallback = document.createElement('span');
      fallback.className = 'fallback';
      fallback.textContent = (movie.title[0] || '?').toUpperCase();
      poster.appendChild(fallback);

      if (TMDB_ENABLED && movie.fetchPosterUrl) {
        fetchBtn = document.createElement('button');
        fetchBtn.type = 'button';
        fetchBtn.className = 'fetch-poster-btn';
        fetchBtn.title = 'Fetch poster from TMDb';
        fetchBtn.innerHTML = DOWNLOAD_ICON;
        fetchBtn.addEventListener('click', (e) => fetchPoster(e, movie, fetchBtn));
      }
    }

    const body = document.createElement('div');
    body.className = 'card-body';
    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = movie.title;
    const footer = document.createElement('div');
    footer.className = 'card-footer';
    const year = document.createElement('div');
    year.className = 'card-year';
    year.textContent = movie.year || '';
    footer.appendChild(year);
    if (fetchBtn) footer.appendChild(fetchBtn);
    body.append(title, footer);

    card.append(poster, body);
    gridEl.appendChild(card);
  }

  paginationEl.hidden = totalPages <= 1;
  totalPagesEl.textContent = totalPages;
  pageInputEl.max = totalPages;
  pageInputEl.value = page;
  document.getElementById('prev-page').disabled = page === 1;
  document.getElementById('next-page').disabled = page === totalPages;
}

searchEl.addEventListener('input', (e) => {
  query = e.target.value;
  clearSearchEl.hidden = !query;
  page = 1;
  renderGrid();
});

clearSearchEl.addEventListener('click', () => {
  searchEl.value = '';
  query = '';
  clearSearchEl.hidden = true;
  page = 1;
  renderGrid();
  searchEl.focus();
});

genreFilterEl.addEventListener('change', (e) => {
  genreFilter = e.target.value;
  page = 1;
  renderGrid();
});

document.querySelectorAll('input[name="sort"]').forEach((el) => {
  el.addEventListener('change', (e) => {
    sortBy = e.target.value;
    page = 1;
    renderGrid();
  });
});

pageSizeEl.addEventListener('change', (e) => {
  pageSize = Math.max(1, Number(e.target.value) || DEFAULT_PAGE_SIZE);
  pageSizeEl.value = pageSize;
  setCookie('pageSize', pageSize);
  page = 1;
  renderGrid();
});

document.getElementById('prev-page').addEventListener('click', () => { page -= 1; renderGrid(); });
document.getElementById('next-page').addEventListener('click', () => { page += 1; renderGrid(); });
pageInputEl.addEventListener('change', (e) => {
  page = Number(e.target.value) || 1;
  renderGrid();
});

// Left/right arrow keys page through the grid, unless the user is typing
// into a text field (search, page-size, page-jump) where arrows should
// move the text cursor instead.
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft' && page > 1) {
    page -= 1;
    renderGrid();
  } else if (e.key === 'ArrowRight' && page < Number(totalPagesEl.textContent)) {
    page += 1;
    renderGrid();
  }
});

renderGrid();

document.getElementById('theme-toggle').addEventListener('click', () => {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if (isLight) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('theme', 'dark');
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    localStorage.setItem('theme', 'light');
  }
});
</script>
</body>
</html>
