<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} — CineVault</title>
<style>
  :root {
    --color-bg: #0b0d12;
    --color-surface: #141926;
    --color-surface-hover: #1b2233;
    --color-text: #e6e8ee;
    --color-text-dim: #9aa1b1;
    --color-border: #232a3b;
    --color-accent: #34d3ac;
    --radius: 10px;
    --radius-lg: 16px;
    --shadow-lg: 0 20px 40px rgba(0,0,0,.5);
    --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  a { color: var(--color-accent); }

  .nav {
    display: flex; align-items: center; gap: 8px;
    padding: var(--space-4) var(--space-6);
    border-bottom: 1px solid var(--color-border);
  }
  .nav-brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 18px; color: var(--color-accent); text-decoration: none; }
  .nav-brand:hover { opacity: 0.8; }

  main { padding: var(--space-6); max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; }

  .player-video-wrap {
    border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-lg); background: #000;
    width: 95vw; max-width: 95vw; min-width: 320px;
    aspect-ratio: 16/9;
    resize: horizontal;
  }
  .player-video-wrap video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }
  .player-title { font-size: 28px; margin: var(--space-4) 0 0; max-width: 95vw; }
  .player-year { color: var(--color-text-dim); font-size: 15px; }

  .player-info { max-width: 95vw; width: 700px; margin-top: var(--space-4); }
  .genre-list { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-3); }
  .genre-pill { border: 1px solid var(--color-border); border-radius: 999px; padding: 4px 12px; font-size: 12px; color: var(--color-text-dim); }
  .overview { line-height: 1.5; color: var(--color-text); }

  .download-list { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-4); }
  .download-link {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--color-border); border-radius: var(--radius);
    padding: 6px 14px; font-size: 13px; text-decoration: none;
    color: var(--color-text); background: var(--color-surface);
  }
  .download-link:hover { background: var(--color-surface-hover); }
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-brand" id="brand-link" title="Back to collection">
    <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path opacity="0.25" d="M224,80l-96,56L32,80l96-56Z"/><path d="M230.91,172A8,8,0,0,1,228,182.91l-96,56a8,8,0,0,1-8.06,0l-96-56A8,8,0,0,1,36,169.09l92,53.65,92-53.65A8,8,0,0,1,230.91,172ZM220,121.09l-92,53.65L36,121.09A8,8,0,0,0,28,134.91l96,56a8,8,0,0,0,8.06,0l96-56A8,8,0,1,0,220,121.09ZM24,80a8,8,0,0,1,4-6.91l96-56a8,8,0,0,1,8.06,0l96,56a8,8,0,0,1,0,13.82l-96,56a8,8,0,0,1-8.06,0l-96-56A8,8,0,0,1,24,80Zm23.88,0L128,126.74,208.12,80,128,33.26Z"/></svg>
    CineVault
  </a>
</nav>

<main>
  <div class="player-video-wrap">
    <video id="player-video" controls src="{{.VideoURL}}">
      {{if .SubtitleURL}}<track kind="subtitles" src="{{.SubtitleURL}}" srclang="en" label="English" default>{{end}}
    </video>
  </div>
  <h1 class="player-title">{{.Title}}</h1>
  <div class="player-year">{{.Year}}</div>

  {{if or .Overview .Genres}}
  <div class="player-info">
    {{if .Genres}}
    <div class="genre-list">
      {{range .Genres}}<span class="genre-pill">{{.}}</span>{{end}}
    </div>
    {{end}}
    {{if .Overview}}<p class="overview">{{.Overview}}</p>{{end}}
  </div>
  {{end}}

  <div class="download-list">
    {{if .MP4URL}}<a class="download-link" href="{{.MP4URL}}" download>Download MP4</a>{{end}}
    {{if .SRTURL}}<a class="download-link" href="{{.SRTURL}}" download>Download SRT</a>{{end}}
    {{if .VTTURL}}<a class="download-link" href="{{.VTTURL}}" download>Download VTT</a>{{end}}
  </div>
</main>

<script>
function getCookie(name) {
  const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return match ? decodeURIComponent(match[1]) : null;
}

function setCookie(name, value) {
  document.cookie = name + '=' + encodeURIComponent(value) + '; max-age=' + (400 * 24 * 60 * 60) + '; path=/';
}

function deleteCookie(name) {
  document.cookie = name + '=; max-age=0; path=/';
}

const video = document.getElementById('player-video');
const resumeKey = 'resume:' + "{{.VideoURL}}";
let lastSavedTime = 0;

function saveProgress() {
  if (!video.currentSrc) return;
  setCookie(resumeKey, Math.floor(video.currentTime));
}

video.addEventListener('loadedmetadata', () => {
  const resumeAt = Number(getCookie(resumeKey));
  if (resumeAt > 5 && resumeAt < video.duration - 5) {
    video.currentTime = resumeAt;
  }
}, { once: true });

video.addEventListener('timeupdate', () => {
  if (Math.abs(video.currentTime - lastSavedTime) >= 5) {
    lastSavedTime = video.currentTime;
    saveProgress();
  }
});
video.addEventListener('pause', saveProgress);
video.addEventListener('ended', () => deleteCookie(resumeKey));

// pagehide (not beforeunload) keeps this page eligible for the back-forward
// cache, so the browser's Back button can restore the grid's scroll
// position instead of reloading it from scratch.
window.addEventListener('pagehide', saveProgress);

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') {
    e.preventDefault();
    const skip = e.shiftKey ? 30 : 10;
    video.currentTime = Math.min(video.duration || Infinity, video.currentTime + skip);
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    const skip = e.shiftKey ? 30 : 10;
    video.currentTime = Math.max(0, video.currentTime - skip);
  } else if (e.key === ' ') {
    e.preventDefault();
    if (document.activeElement === video) return; // native controls already toggled it
    if (video.paused) {
      video.play().catch(() => {});
    } else {
      video.pause();
    }
  }
});

document.getElementById('brand-link').addEventListener('click', (e) => {
  if (window.history.length > 1) {
    e.preventDefault();
    window.history.back();
  }
});
</script>
</body>
</html>
